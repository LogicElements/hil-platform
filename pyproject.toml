[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hil-platform"
dynamic = ["version"]
description = "Device drivers, HAL blocks and station configuration for the HIL test platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "filelock>=3.12",
    "pytest>=8.1",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.12", "types-PyYAML", "types-pyserial"]

[project.entry-points.pytest11]
hil = "hil.pytest_plugin"

[project.scripts]
hil = "hil.cli:run"

[tool.hatch.version]
path = "src/hil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["hil"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["hil.config.*", "hil.blocks.*", "hil.signals.*", "hil.comm.*"]
strict = true
