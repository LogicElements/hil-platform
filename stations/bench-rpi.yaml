# Bench station on Linux: Raspberry Pi 4 (rpi-hil-a, Raspberry Pi OS 64-bit) with
# Quido RS 2/32, Analog Discovery 3 and the ST-Link V3 of a NUCLEO-H7A3ZI-Q
# (bring-up, doc/software/oziveni.md). OpenOCD and its scripts come from the distribution.
# Loopbacks: relay 12 -> IN1, relay 13 -> IN2 (Quido inputs powered from 7-28 V);
# DIO 8..13 -> DIO 0..5; W1 -> 1+, W2 -> 2+, 1- and 2- to ground.
name: bench-rpi
labels: [bench]
profile: standard-v1
devices:
  relay_bus:
    driver: modbus_rtu_bus
    port: /dev/serial/by-id/usb-FTDI_WAVE-TOOLS-MODBUS_BG01BDYC-if00-port0
    baud: 115200
    parity: E
  quido: {driver: quido_rs_2_32, bus: relay_bus, address: 49}
  ad3:
    driver: analog_discovery_3
    serial: 210415BB5F29
    dio_outputs: [8, 9, 10, 11, 12, 13]
  stlink:
    driver: openocd
    adapter_serial: 002600393532510B31333430
terminals:
  X1.1: {kind: switch, relay: quido.11}
  X1.2: {kind: switch, relay: quido.12}
  X2.1: {kind: sense, input: ad3.dio0}
  X2.2: {kind: sense, input: ad3.dio1}
  X2.3: {kind: sense, input: ad3.dio2}
  X2.4: {kind: sense, input: ad3.dio3}
  X2.5: {kind: sense, input: ad3.dio4}
  X2.6: {kind: sense, input: ad3.dio5}
  X2.7: {kind: sense, input: quido.in0}
  X2.8: {kind: sense, input: quido.in1}
  X3.1: {kind: logic_out, output: ad3.dio8}
  X3.2: {kind: logic_out, output: ad3.dio9}
  X3.3: {kind: logic_out, output: ad3.dio10}
  X3.4: {kind: logic_out, output: ad3.dio11}
  X3.5: {kind: logic_out, output: ad3.dio12}
  X3.6: {kind: logic_out, output: ad3.dio13}
  AO.0: {kind: analog_out, direct: ad3.awg1}
  AO.1: {kind: analog_out, direct: ad3.awg2}
  AI.1: {kind: analog_in, scope: ad3.ch1}
  AI.3: {kind: analog_in, scope: ad3.ch2}
  SWD: {kind: debug, probe: stlink}
