# Bench station on Windows: serial ports without the FT4232H module (bring-up,
# doc/software/oziveni.md, step 5a). LOG is the VCP of the ST-Link V3 on a NUCLEO-H7A3ZI-Q
# (COM8), COM1 an FTDI USB to RS-485 converter (FT232R, COM7), found by its serial number.
# The relay bus keeps its own converter. OpenOCD is ST's build bundled with STM32CubeIDE 1.12,
# as in bench-stlink.yaml. The Linux variant is bench-serial-linux.yaml.
name: bench-serial
labels: [bench]
profile: standard-v1
devices:
  vcp:
    driver: serial_ports
    ports:
      log: COM8
  dut485:
    driver: serial_ports
    ports:
      a: {serial: A100B73AA, interface: 0}
  stlink:
    driver: openocd
    command: ["C:/ST/STM32CubeIDE_1.12.0/STM32CubeIDE/plugins/com.st.stm32cube.ide.mcu.externaltools.openocd.win32_2.2.300.202301161003/tools/bin/openocd.exe",
              "-c", "reset_config srst_only srst_nogate"]
    search: ["C:/ST/STM32CubeIDE_1.12.0/STM32CubeIDE/plugins/com.st.stm32cube.ide.mcu.debug.openocd_2.0.500.202302091318/resources/openocd/st_scripts"]
    interface: interface/stlink-dap.cfg
    adapter_serial: 002B00313434511934313937
terminals:
  LOG: {kind: serial, port: vcp.log}
  COM1: {kind: rs485, port: dut485.a}
  SWD: {kind: debug, probe: stlink}
