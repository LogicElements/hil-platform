# Station lab-a: the selected hardware set (doc/vyber/doporuceni.md).
# Serial numbers and device paths marked REPLACE are placeholders until the station is
# built; put in the values of the real devices and check them with
#   hil check --station stations/lab-a.yaml --probe
# rel2 is the analog multiplexer: AO.1 to AO.4 use select/connect pairs rel2.0 to rel2.7,
# AI.1 to AI.4 the connect relays rel2.8 to rel2.11.
name: lab-a
labels: [hil, lab-a]
profile: standard-v1
devices:
  # isolated USB to RS-485 converter, the fifth serial port next to the FT4232H
  relay_bus:
    driver: modbus_rtu_bus
    port: /dev/serial/by-id/usb-FTDI_USB-RS485-REPLACE-if00-port0
    baud: 19200
    parity: E
  rel1: {driver: waveshare_relay32, bus: relay_bus, address: 1}
  rel2: {driver: waveshare_relay32, bus: relay_bus, address: 2}
  # Waveshare USB to 4-Ch Serial Converter: A TTL, B TTL or RS-485, C and D isolated RS-485
  ft:
    driver: serial_ports
    ports:
      A: {serial: FT4232-REPLACE, interface: 0}
      B: {serial: FT4232-REPLACE, interface: 1}
      C: {serial: FT4232-REPLACE, interface: 2}
      D: {serial: FT4232-REPLACE, interface: 3}
  stlink: {driver: openocd, interface: interface/stlink.cfg}
  # Digilent Analog Discovery 3: generators awg1, awg2 (±5 V), scope ch1, ch2 (±25 V),
  # digital lines (LVCMOS 3.3 V): dio0 to dio7 DUT outputs (dry contacts with pull-ups to
  # 3.3 V, so inverted), dio8 to dio13 logic inputs of the DUT, dio14 and dio15 spare
  ad3:
    driver: analog_discovery_3
    serial: REPLACE
    dio_outputs: [8, 9, 10, 11, 12, 13]
    dio_invert: [0, 1, 2, 3, 4, 5, 6, 7]
analog:
  # select relay released (NC) = generator 1, operated (NO) = generator 2
  generators: [ad3.awg1, ad3.awg2]
terminals:
  PWR: {kind: power, relays: [rel1.0, rel1.1]}
  X1.1: {kind: switch, relay: rel1.2}
  X1.2: {kind: switch, relay: rel1.3}
  X1.3: {kind: switch, relay: rel1.4}
  X1.4: {kind: switch, relay: rel1.5}
  F1: {kind: fault_path, series: rel1.6, short: rel1.7}
  F2: {kind: fault_path, series: rel1.8, short: rel1.9}
  F3: {kind: fault_path, series: rel1.10, short: rel1.11}
  F4: {kind: fault_path, series: rel1.12, short: rel1.13}
  X2.1: {kind: sense, input: ad3.dio0}
  X2.2: {kind: sense, input: ad3.dio1}
  X2.3: {kind: sense, input: ad3.dio2}
  X2.4: {kind: sense, input: ad3.dio3}
  X2.5: {kind: sense, input: ad3.dio4}
  X2.6: {kind: sense, input: ad3.dio5}
  X2.7: {kind: sense, input: ad3.dio6}
  X2.8: {kind: sense, input: ad3.dio7}
  X3.1: {kind: logic_out, output: ad3.dio8}
  X3.2: {kind: logic_out, output: ad3.dio9}
  X3.3: {kind: logic_out, output: ad3.dio10}
  X3.4: {kind: logic_out, output: ad3.dio11}
  X3.5: {kind: logic_out, output: ad3.dio12}
  X3.6: {kind: logic_out, output: ad3.dio13}
  CON: {kind: serial, port: ft.A}
  LOG: {kind: serial, port: ft.B}
  COM1: {kind: rs485, port: ft.C}
  MON1: {kind: rs485_monitor, port: ft.D}
  SWD: {kind: debug, probe: stlink}
  # fast channel without relays (HW-ANA-03), permanently on generator 1
  AO.0: {kind: analog_out, direct: ad3.awg1}
  AO.1: {kind: analog_out, select: rel2.0, connect: rel2.1}
  AO.2: {kind: analog_out, select: rel2.2, connect: rel2.3}
  AO.3: {kind: analog_out, select: rel2.4, connect: rel2.5}
  AO.4: {kind: analog_out, select: rel2.6, connect: rel2.7}
  # measuring multiplexer: two DUT outputs per scope channel
  AI.1: {kind: analog_in, scope: ad3.ch1, connect: rel2.8}
  AI.2: {kind: analog_in, scope: ad3.ch1, connect: rel2.9}
  AI.3: {kind: analog_in, scope: ad3.ch2, connect: rel2.10}
  AI.4: {kind: analog_in, scope: ad3.ch2, connect: rel2.11}
